[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-os"
version = "0.1.0.dev0"
description = "A deterministic CLI and shared agent skills for a file-based marketing brain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Magallanes" }]
keywords = ["marketing", "cli", "codex", "claude-code", "agent-skills", "ai-brain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
mos = "marketing_os.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["marketing_os*"]

[tool.setuptools.package-data]
marketing_os = [
  "assets/**/*",
  "assets/business-template/.gitignore",
  "assets/business-template/**/.gitkeep",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
