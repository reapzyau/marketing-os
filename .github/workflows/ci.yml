name: ci

on:
  # Branches only. A tag push runs these same gates through the release
  # workflow, which calls this file rather than copying it, so an unfiltered
  # `push` here would run the whole matrix twice for every release.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not cancel the others. Without this, a Windows
      # failure cancelled the whole matrix before macOS or the other Python ever
      # reported, so a bug could sit red for weeks looking like a single problem.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=marketing_os --cov-report=term-missing
      - run: python scripts/check_clean_language.py
      - run: python -m build
      - run: python scripts/smoke_wheel.py
